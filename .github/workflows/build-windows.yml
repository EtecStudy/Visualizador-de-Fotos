name: Build Windows installer

# Compila o instalador do Windows (NSIS .exe) em um runner windows-latest.
# Rodar manualmente: Actions → Build Windows installer → Run workflow
# Ou automaticamente a cada push que altere código/build.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lumina Fotos (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build renderer
        run: npm run build

      - name: Bundle Electron main/preload
        run: npm run electron:compile

      - name: Package Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Path release | Format-Table Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lumina-fotos-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30
